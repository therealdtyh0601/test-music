<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Music Pack Tester (WebAudio)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      background: #0a0f1f;
      color: #e0e7ff;
      font-family: system-ui, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 650px;
      margin: auto;
      padding: 20px;
      background: #111827;
      border-radius: 12px;
      border: 1px solid #1f2937;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }
    select, input, button {
      padding: 10px 12px;
      border-radius: 6px;
      border: none;
      margin-top: 8px;
      width: 100%;
      background: #1f2937;
      color: white;
      font-size: 14px;
    }
    button {
      background: #4f46e5;
      cursor: pointer;
      margin-top: 14px;
      font-weight: 600;
    }
    button:hover {
      background: #6366f1;
    }
    h2 {
      margin-bottom: 6px;
      font-size: 22px;
    }
    hr {
      margin: 22px 0;
      border-color: #1f2937;
    }
    #status {
      margin-top: 16px;
      opacity: 0.85;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>🎧 Music Pack Tester (WebAudio JS)</h2>
    <p>Choose a JS file and play sound generated by WebAudio — no mp3 required.</p>

    <!-- JS FILE SELECTOR -->
    <label>Select JS Music Pack:</label>
    <select id="jsFileSelect">
      <option value="">-- Choose Music Pack --</option>
      <option value="assets/js/music/music_pack_A.js">music_pack_A</option>
      <option value="assets/js/music/music_pack_B.js">music_pack_B</option>
      <option value="assets/js/music/music_pack_C.js">music_pack_C</option>
    </select>

    <button id="loadBtn">Load Music Pack</button>

    <hr />

    <label>Track:</label>
    <select id="trackSelect" disabled></select>

    <button id="playBtn" disabled>▶️ Play</button>
    <button id="pauseBtn" disabled>⏸ Pause</button>

    <label style="margin-top: 14px;">Loop:</label>
    <input type="checkbox" id="loopToggle" />

    <label style="margin-top: 14px;">Volume:</label>
    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5" />

    <p id="status"></p>
  </div>

  <!-- ============================= -->
  <!--         MAIN SCRIPT           -->
  <!-- ============================= -->
  <script type="module">
    let audioCtx = null;
    let masterGain = null;
    let currentTracks = [];
    let currentTrackIndex = 0;
    let currentStopFn = null;

    const jsFileSelect = document.getElementById("jsFileSelect");
    const loadBtn = document.getElementById("loadBtn");
    const trackSelect = document.getElementById("trackSelect");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const loopToggle = document.getElementById("loopToggle");
    const volumeSlider = document.getElementById("volumeSlider");
    const status = document.getElementById("status");

    function setStatus(msg) {
      status.textContent = msg;
    }

    function ensureAudioCtx() {
      if (!audioCtx || audioCtx.state === "closed") {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function ensureMasterGain() {
      const ctx = ensureAudioCtx();
      if (!ctx) return null;

      if (!masterGain) {
        masterGain = ctx.createGain();
        masterGain.gain.value = parseFloat(volumeSlider.value || "0.5");
        masterGain.connect(ctx.destination);
      }
      return masterGain;
    }

    function stopCurrentTrack() {
      if (currentStopFn) {
        try {
          currentStopFn();
        } catch (err) {
          console.warn("Stop error:", err);
        }
      }
      currentStopFn = null;
    }

    // LOAD MUSIC PACK
    loadBtn.addEventListener("click", async () => {
      const file = jsFileSelect.value;
      if (!file) return setStatus("❌ No JS file selected.");

      stopCurrentTrack();

      try {
        setStatus("Loading music pack...");

        const module = await import("./" + file + "?v=" + Date.now());

        if (!Array.isArray(module.MusicPack)) {
          return setStatus("❌ JS file missing: export const MusicPack = [...]");
        }

        currentTracks = module.MusicPack;
        trackSelect.innerHTML = "";
        currentTracks.forEach((track, index) => {
          const opt = document.createElement("option");
          opt.value = String(index);
          opt.textContent = track.label || track.id || `Track ${index + 1}`;
          trackSelect.appendChild(opt);
        });

        trackSelect.disabled = false;
        playBtn.disabled = false;
        pauseBtn.disabled = false;
        currentTrackIndex = 0;

        setStatus(`✅ Loaded ${currentTracks.length} tracks from ${file}`);

      } catch (err) {
        console.error(err);
        setStatus("❌ Error loading JS file. See console.");
      }
    });

    // SWITCH TRACK
    trackSelect.addEventListener("change", () => {
      stopCurrentTrack();
      currentTrackIndex = parseInt(trackSelect.value, 10) || 0;
      setStatus("Track selected: " + (currentTracks[currentTrackIndex].label || ""));
    });

    // PLAY
    playBtn.addEventListener("click", () => {
      const track = currentTracks[currentTrackIndex];
      if (!track) return setStatus("❌ No track selected.");

      const ctx = ensureAudioCtx();
      const mg = ensureMasterGain();

      stopCurrentTrack();

      try {
        currentStopFn = track.play(ctx, {
          masterGain: mg,
          loop: loopToggle.checked
        });
        setStatus("▶️ Playing: " + (track.label || track.id));
      } catch (err) {
        console.error(err);
        setStatus("❌ Failed to play track.");
      }
    });

    // PAUSE
    pauseBtn.addEventListener("click", () => {
      stopCurrentTrack();
      setStatus("⏸ Paused.");
    });

    // VOLUME
    volumeSlider.addEventListener("input", () => {
      if (masterGain) {
        masterGain.gain.value = parseFloat(volumeSlider.value || "0.5");
      }
    });

    // LOOP
    loopToggle.addEventListener("change", () => {
      setStatus(`Loop is now ${loopToggle.checked ? "ON" : "OFF"} (applies on next play)`);
    });
  </script>

</body>
</html>
